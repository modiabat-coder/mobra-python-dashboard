[tool.black]
line-length = 120
target-version = ["py311", "py312"]
extend-exclude = '''
/(
    \.git
  | \.hypothesis
  | \.pytest_cache
  | \.venv
  | __pycache__
)/
'''

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  ".git",
  ".hypothesis",
  ".pytest_cache",
  ".venv",
  "__pycache__",
  "MOBRA_Demo_Report.html",
  "coverage.xml",
  "htmlcov",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: focused deterministic unit tests",
  "integration: multi-module or end-to-end pipeline tests",
  "regression: protected demonstration-data expectations",
  "io: file-reading and workbook tests",
  "report: HTML or generated-report contract tests",
  "slow: comparatively expensive report, Streamlit, or full-pipeline tests",
  "property: bounded Hypothesis property-based tests",
  "security: local repository safety and secret-pattern checks",
]

[tool.hypothesis]
max_examples = 25
deadline = "none"

[tool.coverage.run]
branch = true
source = ["mobra", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 82
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.html]
directory = "htmlcov"
