<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect x="0" y="0" width="1600" height="900" fill="#F1F5F9"/><rect x="0" y="0" width="1600" height="170" fill="#0B1F3A"/><g transform="translate(42 14) scale(.27)"><g fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"><path d="M256 24 L454 92 V242 C454 380 373 468 256 500 C139 468 58 380 58 242 V92 Z"/><path d="M142 274 h228 v112 h-228 z" fill="#0EA5E9" stroke="#FFFFFF"/><path d="M172 274 v-42 h168 v42 M198 232 v-54 h116 v54"/><circle cx="170" cy="342" r="16" fill="#FFFFFF"/><circle cx="342" cy="342" r="16" fill="#FFFFFF"/><path d="M196 342 h120 M256 178 v-58 M256 120 l-20 22 M256 120 l20 22"/></g></g><text x="195" y="78" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#FFFFFF">MOBRA</text><text x="195" y="122" font-family="Arial,sans-serif" font-size="24" fill="#FFFFFF">MOBRA — Mobile Operational Biosecurity Readiness Assessment</text><text x="72" y="270" font-family="Arial,sans-serif" font-size="56" font-weight="700" fill="#0B1F3A">Biosecurity Readiness Index</text><text x="72" y="325" font-family="Arial,sans-serif" font-size="26" fill="#475569">A score of requirement readiness that does not override blocking controls.</text><rect x="72" y="380" width="930" height="300" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/><text x="112" y="430" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0F766E">MOBRA practice points</text><circle cx="125" cy="482" r="10" fill="#0EA5E9"/><text x="155" y="490" font-family="Arial,sans-serif" font-size="24" fill="#17202A">Use documented context, responsibilities, and review points.</text><circle cx="125" cy="530" r="10" fill="#0EA5E9"/><text x="155" y="538" font-family="Arial,sans-serif" font-size="24" fill="#17202A">Connect controls to objective evidence and traceable decisions.</text><circle cx="125" cy="578" r="10" fill="#0EA5E9"/><text x="155" y="586" font-family="Arial,sans-serif" font-size="24" fill="#17202A">Keep uncertainty, limitations, and escalation visible.</text><circle cx="125" cy="626" r="10" fill="#0EA5E9"/><text x="155" y="634" font-family="Arial,sans-serif" font-size="24" fill="#17202A">Treat outputs as demonstration support, not authorization.</text><text x="72" y="755" font-family="Arial,sans-serif" font-size="21" fill="#475569">Educational summary. Source basis: WHO guidance, ISO standards, BMBL, and MOBRA methodology notes.</text><text x="72" y="792" font-family="Arial,sans-serif" font-size="21" fill="#475569">No endorsement is claimed. Demonstration outputs are examples and require qualified institutional review.</text><text x="72" y="842" font-family="Arial,sans-serif" font-size="20" fill="#0B1F3A">Mohammad Ahmad Yousef E&#x27;Diabat | modiabat@gmail.com | https://github.com/modiabat-coder/mobra-python-dashboard</text></svg>